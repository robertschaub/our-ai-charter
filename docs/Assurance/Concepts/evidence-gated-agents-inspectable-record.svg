<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">A decision people can inspect</title><desc id="desc">A conceptual EGA record connects the exact proposal, evidence and uncertainty, authority for release and recorded outcome. It supports inspection and challenge, subject to access permissions. It does not prove truth or guarantee remedy.</desc><!-- SPDX-License-Identifier: CC-BY-SA-4.0 --><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F4EEE4" stroke="none" stroke-width="2"/><rect x="70" y="65" width="8" height="44" rx="4" fill="#AD7358" stroke="none" stroke-width="2"/><text x="100" y="97" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#203746">EVIDENCE-GATED AGENTS</text><text x="70" y="193" font-family="Arial, sans-serif" font-size="57" font-weight="700" fill="#203746">A decision people can inspect</text><text x="70" y="246" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#4B6374">What a future record could connect</text><rect x="70" y="295" width="700" height="180" rx="22" fill="#DDE5E0" stroke="#D2DEE5" stroke-width="2"/><text x="98" y="341" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#4B6374">01</text><text x="155" y="339" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#203746">THE PROPOSAL</text><text x="98" y="394" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#19364C">What exactly was proposed?</text><text x="98" y="440" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#4B6374">Keep its conditions and limits visible.</text><rect x="830" y="295" width="700" height="180" rx="22" fill="#FFFFFF" stroke="#D2DEE5" stroke-width="2"/><text x="858" y="341" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#4B6374">02</text><text x="915" y="339" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#203746">THE EVIDENCE</text><text x="858" y="394" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#19364C">What supports it? What is missing?</text><text x="858" y="440" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#4B6374">Show sources, uncertainty and disagreement.</text><rect x="70" y="510" width="700" height="180" rx="22" fill="#FFFFFF" stroke="#D2DEE5" stroke-width="2"/><text x="98" y="556" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#4B6374">03</text><text x="155" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#203746">THE AUTHORITY</text><text x="98" y="609" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#19364C">Was release authorised, and by whom?</text><text x="98" y="655" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#4B6374">For which purpose and recipient?</text><rect x="830" y="510" width="700" height="180" rx="22" fill="#EAD4C3" stroke="#D2DEE5" stroke-width="2"/><text x="858" y="556" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#4B6374">04</text><text x="915" y="554" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#203746">THE OUTCOME</text><text x="858" y="609" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#19364C">What was released or held?</text><text x="858" y="655" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#4B6374">Record what happened and the reasons.</text><rect x="70" y="725" width="1460" height="67" rx="22" fill="#203746" stroke="none" stroke-width="2"/><text x="270" y="769" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Inspect the basis  /  Raise a challenge  /  Seek correction</text><text x="70" y="835" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#4B6374">Access follows permissions. A record is not proof of truth or a guarantee of remedy.</text><text x="70" y="875" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#4B6374">Illustrative concept, not a receipt schema or an implemented EGA service.</text></svg>