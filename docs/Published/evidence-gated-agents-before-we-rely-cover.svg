<rect x="724" y="564" width="602" height="330" rx="30" fill="#E7BE67" stroke="none" stroke-width="2" /><rect x="714" y="554" width="602" height="330" rx="30" fill="url(#gate)" stroke="#D99629" stroke-width="3" filter="url(#shadow)"/><rect x="714" y="554" width="14" height="330" rx="7" fill="url(#edge)" stroke="none" stroke-width="2" /><g transform="translate(1204 591)" fill="none" stroke="#BE8120" stroke-width="3" opacity=".55"><path d="M36 0 L67 12 V38 Q66 60 36 77 Q6 60 5 38 V12 Z"/><path d="M8 27 H64 M8 43 H64 M19 59 H53 M36 11 V27 M22 27 V43 M50 27 V43 M36 43 V59"/></g><text x="756" y="634" font-size="72" fill="#A96106" font-weight="700" text-anchor="start">EGA</text><text x="757" y="676" font-size="29" fill="#A96106" font-weight="400" text-anchor="start">Analysis + release controls</text><rect x="746" y="710" width="165" height="55" rx="13" fill="#FFFBEE" stroke="#E9C884" stroke-width="2" /><text x="828.5" y="747" font-size="29" fill="#173146" font-weight="600" text-anchor="middle">Evidence</text><rect x="922" y="710" width="170" height="55" rx="13" fill="#FFFBEE" stroke="#E9C884" stroke-width="2" /><text x="1007.0" y="747" font-size="29" fill="#173146" font-weight="600" text-anchor="middle">Authority</text><rect x="1103" y="710" width="179" height="55" rx="13" fill="#FFFBEE" stroke="#E9C884" stroke-width="2" /><text x="1192.5" y="747" font-size="29" fill="#173146" font-weight="600" text-anchor="middle">Disclosure</text>
<text x="756" y="820" font-size="26" fill="#173146" font-weight="600" text-anchor="start">Foundations: FactHarbor Alpha</text>
<text x="756" y="857" font-size="26" fill="#173146" font-weight="600" text-anchor="start">+ Our AI Charter Runtime PoC</text>
<path d="M1336 634 H1454" fill="none" stroke="#087F82" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M1336 760 H1454" fill="none" stroke="#A34E30" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/>
<rect x="1468" y="579" width="367" height="112" rx="22" fill="url(#mint)" stroke="#9ACCC4" stroke-width="2" />
<text x="1498" y="626" font-size="43" fill="#087F82" font-weight="700" text-anchor="start">Released</text>
<text x="1498" y="666" font-size="29" fill="#506775" font-weight="400" text-anchor="start">Checked output</text>
<rect x="1468" y="711" width="367" height="112" rx="22" fill="url(#warm)" stroke="#D9AF9D" stroke-width="2" />
<text x="1498" y="757" font-size="43" fill="#A34E30" font-weight="700" text-anchor="start">Hold</text>
<text x="1498" y="797" font-size="29" fill="#506775" font-weight="400" text-anchor="start">Resolve the gap</text>
<path d="M1015 903 V930" fill="none" stroke="#506775" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slate)"/>
<g transform="translate(715 942) scale(0.7)" fill="none" stroke="#326CA2" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="19" width="32" height="28" rx="6"/><path d="M11 19 V12 A9 9 0 0 1 29 12 V19 M20 29 V36"/></g>
<text x="760" y="973" font-size="31" fill="#506775" font-weight="400" text-anchor="start">Record for inspection &amp; challenge</text>
</g></svg>