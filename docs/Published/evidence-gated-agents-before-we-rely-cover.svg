<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Evidence-Gated Agents — evidence before reliance</title><desc id="desc">Broader EGA design: Working AI submits a claim, decision or action instruction. The evidence service retrieves material; EGA analyses support, contradiction and gaps. Outside the acting AI, EGA checks evidence, authority and disclosure, then releases or holds that output. Releasing an instruction does not authorise its execution; the resulting action requires its own authority and evidence checks. Records support inspection and challenge. Existing foundations are FactHarbor Alpha and the Our AI Charter Runtime proof of concept. Their integration is the next milestone, not a deployed system.</desc><!-- SPDX-License-Identifier: CC-BY-SA-4.0 --><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7FAFA"/><stop offset="1" stop-color="#FFFCF6"/></linearGradient><linearGradient id="cool" x2="0.7" y2="1"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#E7F0FA"/></linearGradient><linearGradient id="mint" x2="1" y2="1"><stop stop-color="#F0FAF7"/><stop offset="1" stop-color="#DFF1EC"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#FFF9F4"/><stop offset="1" stop-color="#F7E8DF"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#FFF9E7"/><stop offset="1" stop-color="#F5D88F"/></linearGradient><linearGradient id="edge"><stop stop-color="#F8BD49"/><stop offset="1" stop-color="#D78B1C"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183648" flood-opacity=".08"/></filter><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F82"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326CA2"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A34E30"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506775"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="url(#paper)" stroke="none" stroke-width="2" />
<rect x="82" y="72" width="9" height="125" rx="4" fill="#DA9829" stroke="none" stroke-width="2" />
<text x="112" y="132" font-size="76" fill="#173146" font-weight="700" text-anchor="start">Evidence-Gated Agents</text>
<text x="114" y="195" font-size="43" fill="#506775" font-weight="400" text-anchor="start">Evidence before reliance.</text>
<rect x="535" y="240" width="845" height="223" rx="26" fill="url(#cool)" stroke="#B9CDDF" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(570 266) scale(0.8)" fill="none" stroke="#326CA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2 H30 L42 14 V54 H4 Z M30 2 V14 H42 M13 26 H32 M13 35 H32 M13 44 H25"/></g>
<text x="633" y="300" font-size="48" fill="#326CA2" font-weight="700" text-anchor="start">Evidence service</text>
<text x="573" y="367" font-size="43" fill="#173146" font-weight="600" text-anchor="start">Finds evidence on request</text>
<text x="573" y="419" font-size="32" fill="#506775" font-weight="400" text-anchor="start">Includes sources &amp; search coverage</text>
<path d="M845 550 V477" fill="none" stroke="#326CA2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="12 12"/>
<text x="820" y="499" font-size="28" fill="#326CA2" font-weight="500" text-anchor="end">Search request</text>
<path d="M1090 478 V547" fill="none" stroke="#326CA2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1113" y="505" font-size="28" fill="#326CA2" font-weight="500" text-anchor="start">Search results</text>
<rect x="80" y="602" width="430" height="183" rx="25" fill="url(#mint)" stroke="#ACD7D0" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(110 635) scale(0.8)" fill="none" stroke="#087F82" stroke-width="3" stroke-linecap="round"><rect x="10" y="10" width="40" height="40" rx="9"/><rect x="21" y="21" width="18" height="18" rx="4"/><path d="M20 1 V10 M20 50 V59 M1 20 H10 M50 20 H59"/><path d="M30 1 V10 M30 50 V59 M1 30 H10 M50 30 H59"/><path d="M40 1 V10 M40 50 V59 M1 40 H10 M50 40 H59"/></g>
