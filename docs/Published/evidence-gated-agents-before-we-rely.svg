<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title desc"><title id="title">Evidence-Gated Agents — how a recommendation is checked</title><desc id="desc">Intended recommendation workflow, still to be integrated and evaluated. Permitted external and internal confidential sources feed an evidence service; confidential-source handling requires development. EGA requests examination of supporting and contradicting evidence and checks evidence, authority and disclosure outside the acting AI. A recommendation may be released, or held for missing evidence, a narrower proposal or authorised human judgment when needed. A limited decision record supports inspection, challenge and correction. Release does not execute an action.</desc><!-- SPDX-License-Identifier: CC-BY-SA-4.0 --><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7FAFA"/><stop offset="1" stop-color="#FFFCF6"/></linearGradient><linearGradient id="cool" x2="0.7" y2="1"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#E7F0FA"/></linearGradient><linearGradient id="mint" x2="1" y2="1"><stop stop-color="#F0FAF7"/><stop offset="1" stop-color="#DFF1EC"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#FFF9F4"/><stop offset="1" stop-color="#F7E8DF"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#FFF9E7"/><stop offset="1" stop-color="#F5D88F"/></linearGradient><linearGradient id="edge"><stop stop-color="#F8BD49"/><stop offset="1" stop-color="#D78B1C"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183648" flood-opacity=".08"/></filter><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F82"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326CA2"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A34E30"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506775"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1600" height="1700" rx="0" fill="url(#paper)" stroke="none" stroke-width="2" />
<rect x="70" y="59" width="8" height="119" rx="4" fill="#DA9829" stroke="none" stroke-width="2" />
<text x="99" y="110" font-size="66" fill="#173146" font-weight="700" text-anchor="start">Evidence-Gated Agents</text>
<text x="101" y="169" font-size="31" fill="#506775" font-weight="400" text-anchor="start">What must be checked before a recommendation proceeds?</text>
<path d="M73 238 H112" fill="none" stroke="#087F82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="249" font-size="31" fill="#506775" font-weight="400" text-anchor="start">Controls outside the acting AI</text>
<rect x="70" y="310" width="535" height="308" rx="22" fill="#FFFFFF" stroke="#BDCEDB" stroke-width="2" />
<g transform="translate(96 338) scale(0.8)" fill="none" stroke="#326CA2" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="19" width="32" height="28" rx="6"/><path d="M11 19 V12 A9 9 0 0 1 29 12 V19 M20 29 V36"/></g>
<text x="145" y="370" font-size="37" fill="#173146" font-weight="700" text-anchor="start">Evidence sources</text>
<text x="99" y="418" font-size="32" fill="#506775" font-weight="400" text-anchor="start">External sources</text>
<text x="99" y="460" font-size="32" fill="#506775" font-weight="400" text-anchor="start">Internal confidential sources</text>
<text x="99" y="507" font-size="30" fill="#326CA2" font-weight="600" text-anchor="start">Before use: authorised</text>
<text x="99" y="545" font-size="30" fill="#326CA2" font-weight="600" text-anchor="start">access + processing</text>
<text x="99" y="591" font-size="28" fill="#506775" font-weight="400" text-anchor="start">Confidential handling: to build</text>
<path d="M613 450 H688" fill="none" stroke="#087F82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="650" y="420" font-size="20" fill="#087F82" font-weight="500" text-anchor="middle">Permitted</text>
<rect x="704" y="310" width="826" height="308" rx="22" fill="url(#cool)" stroke="#AEC7DE" stroke-width="2" filter="url(#shadow)"/>
<text x="738" y="374" font-size="46" fill="#326CA2" font-weight="700" text-anchor="start">Evidence service</text>
<text x="738" y="441" font-size="42" fill="#173146" font-weight="600" text-anchor="start">Supporting evidence</text>
<text x="738" y="497" font-size="42" fill="#173146" font-weight="600" text-anchor="start">Contradicting evidence</text>
<text x="738" y="574" font-size="30" fill="#506775" font-weight="400" text-anchor="start">Assesses; does not authorise release.</text>
<path d="M845 717 V632" fill="none" stroke="#326CA2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" stroke-dasharray="12 12"/>
<text x="822" y="678" font-size="25" fill="#326CA2" font-weight="500" text-anchor="end">Search / request</text>
<path d="M1100 632 V717" fill="none" stroke="#326CA2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1122" y="678" font-size="26" fill="#326CA2" font-weight="500" text-anchor="start">Assessment</text>
<rect x="70" y="793" width="385" height="237" rx="24" fill="url(#mint)" stroke="#ACD7D0" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(100 825) scale(0.7)" fill="none" stroke="#087F82" stroke-width="3" stroke-linecap="round"><rect x="10" y="10" width="40" height="40" rx="9"/><rect x="21" y="21" width="18" height="18" rx="4"/><path d="M20 1 V10 M20 50 V59 M1 20 H10 M50 20 H59"/><path d="M30 1 V10 M30 50 V59 M1 30 H10 M50 30 H59"/><path d="M40 1 V10 M40 50 V59 M1 40 H10 M50 40 H59"/></g>
<text x="167" y="864" font-size="38" fill="#087F82" font-weight="700" text-anchor="start">Working AI</text>
<text x="101" y="929" font-size="29" fill="#173146" font-weight="400" text-anchor="start">Proposes an exact</text>
<text x="101" y="970" font-size="29" fill="#173146" font-weight="400" text-anchor="start">recommendation</text>
<path d="M464 907 H547" fill="none" stroke="#087F82" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="575" y="745" width="965" height="416" rx="30" fill="#E7BE67" stroke="none" stroke-width="2" /><rect x="565" y="735" width="965" height="416" rx="30" fill="url(#gate)" stroke="#D99629" stroke-width="3" filter="url(#shadow)"/><rect x="565" y="735" width="14" height="416" rx="7" fill="url(#edge)" stroke="none" stroke-width="2" /><g transform="translate(1418 772)" fill="none" stroke="#BE8120" stroke-width="3" opacity=".55"><path d="M36 0 L67 12 V38 Q66 60 36 77 Q6 60 5 38 V12 Z"/><path d="M8 27 H64 M8 43 H64 M19 59 H53 M36 11 V27 M22 27 V43 M50 27 V43 M36 43 V59"/></g><text x="607" y="815" font-size="72" fill="#A96106" font-weight="700" text-anchor="start">EGA</text><text x="608" y="857" font-size="31" fill="#A96106" font-weight="400" text-anchor="start">Checks before release</text><rect x="597" y="888" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="929" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Evidence</text><text x="830" y="929" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Enough for this recommendation?</text><rect x="597" y="967" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="1008" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Authority</text><text x="830" y="1008" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Within the current mandate?</text><rect x="597" y="1046" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="1087" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Disclosure</text><text x="830" y="1087" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Permitted to release this content?</text>
<path d="M775 1170 V1212 H438 V1232" fill="none" stroke="#087F82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M1315 1170 V1232" fill="none" stroke="#A34E30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/>
<rect x="70" y="1246" width="535" height="200" rx="22" fill="url(#mint)" stroke="#9ACCC4" stroke-width="2" />
<text x="99" y="1293" font-size="39" fill="#087F82" font-weight="700" text-anchor="start">Released</text>
<text x="99" y="1337" font-size="28" fill="#173146" font-weight="400" text-anchor="start">Recommendation + permitted</text>
<text x="99" y="1371" font-size="28" fill="#173146" font-weight="400" text-anchor="start">evidence summary</text>
<text x="99" y="1413" font-size="25" fill="#506775" font-weight="400" text-anchor="start">Release does not execute an action.</text>
<rect x="649" y="1246" width="881" height="200" rx="22" fill="url(#warm)" stroke="#D9AF9D" stroke-width="2" />
<text x="682" y="1293" font-size="38" fill="#A34E30" font-weight="700" text-anchor="start">Held — resolve the gap</text>
<text x="682" y="1349" font-size="26" fill="#173146" font-weight="400" text-anchor="start">Request evidence • Check a narrower recommendation</text>
<text x="682" y="1401" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Authorised human judgment when needed</text>
<g transform="translate(80 1494) scale(0.75)" fill="none" stroke="#506775" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2 H30 L42 14 V54 H4 Z M30 2 V14 H42 M13 26 H32 M13 35 H32 M13 44 H25"/></g>
<text x="131" y="1523" font-size="29" fill="#173146" font-weight="700" text-anchor="start">Decision record</text>
<text x="410" y="1523" font-size="28" fill="#506775" font-weight="400" text-anchor="start">Inspect • Challenge • Correct</text>
<text x="1020" y="1523" font-size="24" fill="#506775" font-weight="400" text-anchor="start">Limited content, access &amp; retention</text>
<path d="M80 1572 H1520" fill="none" stroke="#506775" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="1625" font-size="23" fill="#326CA2" font-weight="700" text-anchor="start">EXISTING FOUNDATIONS</text>
<text x="445" y="1625" font-size="30" fill="#173146" font-weight="500" text-anchor="start">FactHarbor Alpha + Our AI Charter Runtime PoC</text>
<text x="445" y="1666" font-size="26" fill="#506775" font-weight="400" text-anchor="start">Integration remains to be built and evaluated.</text>
</g></svg>