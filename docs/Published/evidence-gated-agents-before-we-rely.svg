<g transform="translate(840 1515) scale(0.7)" fill="none" stroke="#326CA2" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="19" width="32" height="28" rx="6"/><path d="M11 19 V12 A9 9 0 0 1 29 12 V19 M20 29 V36"/></g>
<text x="885" y="1547" font-size="31" fill="#173146" font-weight="700" text-anchor="start">System-wide data protection</text>
<text x="839" y="1594" font-size="26" fill="#173146" font-weight="400" text-anchor="start">Protect information during use and storage,</text>
<text x="839" y="1633" font-size="26" fill="#173146" font-weight="400" text-anchor="start">and whenever it is sent or shared.</text>
</g>
</g></svg>