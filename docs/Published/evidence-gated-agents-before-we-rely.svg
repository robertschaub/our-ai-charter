<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="1260" viewBox="0 0 2040 1260" role="img" aria-labelledby="title desc"><title id="title">Evidence-Gated Agents — output-release checks</title><desc id="desc">Editable layout of the article illustration. This detail begins after the separate permission checks before model use. A retrieval-only evidence service returns found material with sources and search coverage. EGA analyses support, contradiction and gaps and checks evidence, authority and disclosure. Proceed and Do not proceed are to the right of EGA, with human judgement where needed inside the latter box. Restricted decision records and system-wide data protection support accountability. Design, not implemented integration.</desc><!-- SPDX-License-Identifier: CC-BY-SA-4.0 --><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7FAFA"/><stop offset="1" stop-color="#FFFCF6"/></linearGradient><linearGradient id="cool" x2="0.7" y2="1"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#E7F0FA"/></linearGradient><linearGradient id="mint" x2="1" y2="1"><stop stop-color="#F0FAF7"/><stop offset="1" stop-color="#DFF1EC"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#FFF9F4"/><stop offset="1" stop-color="#F7E8DF"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#FFF9E7"/><stop offset="1" stop-color="#F5D88F"/></linearGradient><linearGradient id="edge"><stop stop-color="#F8BD49"/><stop offset="1" stop-color="#D78B1C"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183648" flood-opacity=".08"/></filter><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F82"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326CA2"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A34E30"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506775"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
