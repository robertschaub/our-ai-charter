<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1770" viewBox="0 0 1600 1770" role="img" aria-labelledby="title desc"><title id="title">Evidence-Gated Agents — checks before a claim, decision or action instruction proceeds</title><desc id="desc">Broader EGA design, still to be integrated and evaluated. Authorised external and internal confidential sources feed a retrieval-only evidence service; confidential-source handling requires development. EGA analyses the retrieved material for support, contradiction and gaps, then checks evidence sufficiency, authority and disclosure outside the acting AI. The output — a claim, decision or action instruction — may be released, or held for more evidence, revision and rechecking, or authorised human judgment when needed. A limited decision record supports inspection, challenge and correction. Releasing an instruction does not authorise its execution; the resulting action requires its own authority and evidence checks.</desc><!-- SPDX-License-Identifier: CC-BY-SA-4.0 --><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7FAFA"/><stop offset="1" stop-color="#FFFCF6"/></linearGradient><linearGradient id="cool" x2="0.7" y2="1"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#E7F0FA"/></linearGradient><linearGradient id="mint" x2="1" y2="1"><stop stop-color="#F0FAF7"/><stop offset="1" stop-color="#DFF1EC"/></linearGradient><linearGradient id="warm" x2="1" y2="1"><stop stop-color="#FFF9F4"/><stop offset="1" stop-color="#F7E8DF"/></linearGradient><linearGradient id="gate" x2="1" y2="1"><stop stop-color="#FFF9E7"/><stop offset="1" stop-color="#F5D88F"/></linearGradient><linearGradient id="edge"><stop stop-color="#F8BD49"/><stop offset="1" stop-color="#D78B1C"/></linearGradient><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183648" flood-opacity=".08"/></filter><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F82"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#326CA2"/></marker><marker id="rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#A34E30"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#506775"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1600" height="1770" rx="0" fill="url(#paper)" stroke="none" stroke-width="2" />
<rect x="70" y="59" width="8" height="119" rx="4" fill="#DA9829" stroke="none" stroke-width="2" />
<text x="99" y="110" font-size="66" fill="#173146" font-weight="700" text-anchor="start">Evidence-Gated Agents</text>
<text x="101" y="169" font-size="29" fill="#506775" font-weight="400" text-anchor="start">Checks before AI output is released</text>
<path d="M73 238 H112" fill="none" stroke="#087F82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="249" font-size="31" fill="#506775" font-weight="400" text-anchor="start">Controls outside the acting AI</text>
<rect x="70" y="310" width="535" height="308" rx="22" fill="#FFFFFF" stroke="#BDCEDB" stroke-width="2" />
<g transform="translate(96 334) scale(0.7)" fill="none" stroke="#326CA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2 H30 L42 14 V54 H4 Z M30 2 V14 H42 M13 26 H32 M13 35 H32 M13 44 H25"/></g>
<text x="145" y="370" font-size="37" fill="#173146" font-weight="700" text-anchor="start">Evidence sources</text>
<text x="99" y="418" font-size="32" fill="#506775" font-weight="400" text-anchor="start">External sources</text>
<text x="99" y="460" font-size="32" fill="#506775" font-weight="400" text-anchor="start">Internal confidential sources</text>
<g transform="translate(99 487) scale(0.75)" fill="none" stroke="#326CA2" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="19" width="32" height="28" rx="6"/><path d="M11 19 V12 A9 9 0 0 1 29 12 V19 M20 29 V36"/></g>
<text x="143" y="520" font-size="32" fill="#326CA2" font-weight="600" text-anchor="start">Authorized Access</text>
