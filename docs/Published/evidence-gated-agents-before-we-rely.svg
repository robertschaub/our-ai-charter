<rect x="704" y="310" width="826" height="308" rx="22" fill="url(#cool)" stroke="#AEC7DE" stroke-width="2" filter="url(#shadow)"/>
<text x="738" y="374" font-size="46" fill="#326CA2" font-weight="700" text-anchor="start">Evidence service</text>
<text x="738" y="441" font-size="42" fill="#173146" font-weight="600" text-anchor="start">Finds evidence on request</text>
<text x="738" y="497" font-size="34" fill="#506775" font-weight="400" text-anchor="start">Includes sources &amp; search coverage</text>
