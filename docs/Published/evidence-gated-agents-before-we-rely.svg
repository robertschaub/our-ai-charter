<text x="1122" y="678" font-size="26" fill="#326CA2" font-weight="500" text-anchor="start">Search results</text>
<rect x="70" y="793" width="385" height="237" rx="24" fill="url(#mint)" stroke="#ACD7D0" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(100 825) scale(0.7)" fill="none" stroke="#087F82" stroke-width="3" stroke-linecap="round"><rect x="10" y="10" width="40" height="40" rx="9"/><rect x="21" y="21" width="18" height="18" rx="4"/><path d="M20 1 V10 M20 50 V59 M1 20 H10 M50 20 H59"/><path d="M30 1 V10 M30 50 V59 M1 30 H10 M50 30 H59"/><path d="M40 1 V10 M40 50 V59 M1 40 H10 M50 40 H59"/></g>
<text x="167" y="864" font-size="38" fill="#087F82" font-weight="700" text-anchor="start">Working AI</text>
<text x="101" y="913" font-size="23" fill="#506775" font-weight="400" text-anchor="start">Output to be checked</text>
<text x="101" y="950" font-size="29" fill="#173146" font-weight="400" text-anchor="start">Claim, decision</text>
<text x="101" y="987" font-size="29" fill="#173146" font-weight="400" text-anchor="start">or action instruction</text>
<path d="M464 907 H547" fill="none" stroke="#087F82" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="575" y="745" width="965" height="470" rx="30" fill="#E7BE67" stroke="none" stroke-width="2" /><rect x="565" y="735" width="965" height="470" rx="30" fill="url(#gate)" stroke="#D99629" stroke-width="3" filter="url(#shadow)"/><rect x="565" y="735" width="14" height="470" rx="7" fill="url(#edge)" stroke="none" stroke-width="2" /><g transform="translate(1418 772)" fill="none" stroke="#BE8120" stroke-width="3" opacity=".55"><path d="M36 0 L67 12 V38 Q66 60 36 77 Q6 60 5 38 V12 Z"/><path d="M8 27 H64 M8 43 H64 M19 59 H53 M36 11 V27 M22 27 V43 M50 27 V43 M36 43 V59"/></g><text x="607" y="815" font-size="72" fill="#A96106" font-weight="700" text-anchor="start">EGA</text><text x="608" y="857" font-size="29" fill="#A96106" font-weight="400" text-anchor="start">Analysis + release controls</text><rect x="597" y="888" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="929" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Evidence</text><text x="830" y="929" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Analyse support, contradiction &amp; gaps</text><rect x="597" y="967" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="1008" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Authority</text><text x="830" y="1008" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Within the current mandate?</text><rect x="597" y="1046" width="901" height="64" rx="12" fill="#FFFCF2" stroke="#E9C884" stroke-width="2" /><text x="620" y="1087" font-size="31" fill="#173146" font-weight="700" text-anchor="start">Disclosure</text><text x="830" y="1087" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Permitted to release this content?</text>
<text x="607" y="1170" font-size="26" fill="#173146" font-weight="600" text-anchor="start">Foundations: FactHarbor Alpha + Our AI Charter Runtime PoC</text>
<g transform="translate(0 54)">
<path d="M775 1170 V1212 H438 V1232" fill="none" stroke="#087F82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<path d="M1315 1170 V1232" fill="none" stroke="#A34E30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rust)"/>
<rect x="70" y="1246" width="535" height="200" rx="22" fill="url(#mint)" stroke="#9ACCC4" stroke-width="2" />
<text x="99" y="1293" font-size="39" fill="#087F82" font-weight="700" text-anchor="start">Released</text>
<text x="99" y="1337" font-size="27" fill="#173146" font-weight="400" text-anchor="start">Claim, decision or</text>
<text x="99" y="1371" font-size="27" fill="#173146" font-weight="400" text-anchor="start">action instruction</text>
<text x="99" y="1413" font-size="23" fill="#506775" font-weight="400" text-anchor="start">Release does not authorise execution.</text>
<rect x="649" y="1246" width="881" height="200" rx="22" fill="url(#warm)" stroke="#D9AF9D" stroke-width="2" />
<text x="682" y="1293" font-size="38" fill="#A34E30" font-weight="700" text-anchor="start">Held — resolve the gap</text>
<text x="682" y="1349" font-size="26" fill="#173146" font-weight="400" text-anchor="start">Request evidence • Revise and recheck</text>
<text x="682" y="1401" font-size="27" fill="#506775" font-weight="400" text-anchor="start">Authorised human judgment when needed</text>
<rect x="70" y="1485" width="710" height="175" rx="22" fill="#FFFFFF" stroke="#BDCEDB" stroke-width="2" />
<g transform="translate(99 1513) scale(0.7)" fill="none" stroke="#506775" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2 H30 L42 14 V54 H4 Z M30 2 V14 H42 M13 26 H32 M13 35 H32 M13 44 H25"/></g>
<text x="145" y="1547" font-size="33" fill="#173146" font-weight="700" text-anchor="start">Decision record</text>
<text x="99" y="1594" font-size="29" fill="#173146" font-weight="400" text-anchor="start">Inspect • Challenge • Correct</text>
<g transform="translate(99 1603) scale(0.65)" fill="none" stroke="#326CA2" stroke-width="3.5" stroke-linejoin="round"><rect x="4" y="19" width="32" height="28" rx="6"/><path d="M11 19 V12 A9 9 0 0 1 29 12 V19 M20 29 V36"/></g>
<text x="137" y="1633" font-size="26" fill="#326CA2" font-weight="400" text-anchor="start">Restricted access</text>
